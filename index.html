<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="refresh" content="0; url=/catalog/index_catalog.html">
    <title>대흥정밀</title>
    <script>
        // 혹시 등록된 구형 서비스워커가 남아있다면 강제 등록 해제(unregister)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (var i = 0; i < registrations.length; i++) {
                    registrations[i].unregister();
                }
            });
        }
        window.location.replace("/catalog/index_catalog.html");
    </script>
</head>
<body>
    <p><a href="/catalog/index_catalog.html">대흥정밀 카탈로그로 이동 중...</a></p>
</body>
</html>
